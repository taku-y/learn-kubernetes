apiVersion: batch/v1
kind: Job
metadata:
  name: s3-rust-client
  namespace: rustfs
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: s3-rust-client
          image: s3-rust-client:0.1.0
          imagePullPolicy: Never
          env:
            - name: S3_ENDPOINT
              value: "http://rustfs.rustfs.svc:9000"
            - name: BUCKET_NAME
              value: "rust-bucket"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: rustfs-config
                  key: access-key
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: rustfs-secret
                  key: secret-key
