# Chart の既定は Pod 4 つの分散構成。ノードが 1 台なので Pod 1 つ・ディスク 1 つにする
mode:
  standalone:
    enabled: true
  distributed:
    enabled: false

# 既定の rustfsadmin のままだと Chart がテンプレートの展開を止める。学習用のダミー値
secret:
  rustfs:
    access_key: learnadmin
    secret_key: learn-dummy-secret

# 初期化用コンテナのイメージ。既定の busybox:stable は版が固定されないので固定する
image:
  initImage:
    tag: "1.37"

# PVC を 2 つ（データとログ）作る。PV は pv.yaml で先に用意する
storageclass:
  name: local-ssd
  dataStorageSize: 50Gi
  logStorageSize: 1Gi

service:
  type: NodePort
  endpoint:
    nodePort: 30900
  console:
    nodePort: 30901

# 既定は有効（ingressClassName: nginx）。この k3s には nginx の Ingress Controller が無いので作らない
ingress:
  enabled: false
