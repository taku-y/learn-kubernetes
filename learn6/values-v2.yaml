rootUser: minioadmin
rootPassword: minioadmin

mode: standalone

# Chart の既定値は、インストール後に mc（MinIO のクライアント）の Job でユーザー console を作る。
# mc のイメージはもう取得できず、Job が失敗して Release も failed になるので、ユーザーは作らない
users: []

persistence:
  enabled: true
  storageClass: local-ssd
  size: 50Gi

service:
  type: NodePort
  nodePort: 30900

consoleService:
  type: NodePort
  nodePort: 30901

resources:
  requests:
    memory: 256Mi
    cpu: 100m
  # upgrade で追加: 上限（limits）
  limits:
    memory: 512Mi
    cpu: 500m
